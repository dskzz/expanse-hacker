# Shared SolNet vocabulary, hand-extracted from RFC-2300 (Terminology &
# Concepts), §§1-7 only. Not itself a protocol.yaml/hardware.yaml — this
# is the canonical vocabulary/constants other db/ content files should
# reference by name rather than reinventing (RFC-2300: "Lock this first;
# all RFCs must reference these definitions").
#
# Deliberately excludes RFC-2300 §§8-15 (TLV Key Registry, Error Handling,
# Security Considerations, Interoperability, Operational Behavior,
# Conformance, Document Maintenance, Registry Procedures). That content is
# entirely about AddressRecord/TLV/ProvenancePointer/BareToken grammar —
# RFC-2350 (SolNet Canonical Addressing Standard)'s actual subject, not
# terminology. Flagged to the user 2026-09-04 as a possible vault
# content-assembly issue rather than corrected — RFC files get surgical
# corrections only, and this isn't a typo. Re-derive anything TLV/
# addressing-related from RFC-2350 directly once that's read, not from here.

rfc: RFC-2300

identifier_class:
  UUID_S7:
    description: >
      128-bit, time-sortable identifier, UUIDv7-compatible, extended for
      ledger friendliness. Canonical NetworkID for ledger-anchored
      identity and cross-domain references. MUST be used at the point
      identity is anchored, audited, or enforced across domains; local
      systems MAY use other schemes internally until that point.
    opaque: true   # deliberately encodes no location/authority/policy

address_grammar:
  form: "<LocationChain>//<ServiceChain>"
  rule: "exactly one // boundary; parsers MUST enforce it"
  LocationChain:
    side: left
    meaning: identity authority, trust domain, coarse location
    example: "MCRC:ALPHAFLEET:DONNAGER"
  ServiceChain:
    side: right
    meaning: internal domain structure, service path (locally resolved)
    example: "ENGINEERING:ENG-1:Reactor"

planes:
  location_plane:
    aka: [L-stack]
    legacy_alias: Authority Plane
    concerns: [global identity, coarse ephemeris, beaconing hints, inter-domain reachability]
    layers:
      L2: {name: Identity Resolution, concerns: [UUID-S7, NetworkKeys, NetworkCerts, LedgerAnchors]}
      L3: {name: Directory and Reachability Endpoints, concerns: ["//info", "//beacon", coarse ephemeris hints]}
      L4: {name: Routing and Mobility, concerns: [DTN, store-and-forward, ship-as-router]}
      L5: {name: Trust and Policy, concerns: [cross-domain rules, revocation, jurisdiction]}
  service_plane:
    aka: [S-stack]
    legacy_alias: Namespace Plane
    concerns: [local naming, service discovery, sessions, intra-domain policy]
    layers:
      S2: {name: Local Service Resolution}
      S3: {name: Local Directory / Service Discovery}
      S4: {name: Session / Conversation Layer}
      S5: {name: Local Security and ACLs}

substrate:
  L0: {name: Physical Substrate, concerns: [tightbeam, RF, optics, occlusion, power]}
  L1:
    name: Data-Link (Location/Service split)
    L1_L: {consumer: location-plane, carries: [compressed UUID-S7 hints, trust tags, coarse ephemeris, beacon descriptors, relay capability metadata]}
    L1_S: {consumer: service-plane, carries: [service path hashes, service identifiers, session tokens, QoS metadata]}

role_weight:
  fields: [LocationWeight, ServiceWeight]
  meaning: how strongly a node participates in each plane
  mismatch_behavior: >
    when advertised role weight conflicts with observed behavior, systems
    log AuditEvents and increase verification steps

device_identity_hierarchy:
  # answers a different question at each layer, per RFC-2300 §6.1 -- the
  # RFC-2301 key hierarchy (db/trust/rfc2301-key-hierarchy.yaml) is the
  # concrete cryptographic instantiation of this same layering
  - {layer: Hardware Root, answers: "is the device what it claims to be"}
  - {layer: DeviceKey, answers: "is the device still under expected control"}
  - {layer: Session Key, answers: "is this specific interaction current and authorized"}
  - {layer: PNI, answers: "who/what is the device acting for (no global anchoring required)"}
  - {layer: Delegated credential, answers: "who authorized this action, if the actor isn't the ultimate authority"}

canonical_record_types:
  # RFC-2300 §8 (the terminology-appropriate list) -- confirms the record
  # names already used in db/protocols/rfc2305-duty-reservation.yaml and
  # db/hardware/relay-courier-rig-class-c.yaml are real canonical names,
  # not invented ones
  - FrameDefinitionRecord
  - PowerCapabilityRecord
  - AntennaGeometryRecord
  - AntennaAlignmentStateRecord
  - PowerPolicyRecord
  - DutyCycleRecord
  - PowerStateRecord
  - DutyScheduleRecord
  - NetworkCert
  - LedgerAnchor
  - DelegationToken
  - DelegationReceipt
  - AuditEvent
  common_requirement: "all records MUST include provenance and freshness metadata"

confidence_model:
  # not a boolean trust flag -- freshness/provenance decide how much
  # weight a consumer gives a record
  states: [VERIFIED, UNVERIFIED, ADVISORY]
  rule: >
    when freshness is uncertain, consumers treat records as advisory and
    increase verification steps. delayed ledger writes force UNVERIFIED
    mode with reduced privileges (RFC-2300 §4.2, §9.1 stress behavior).
